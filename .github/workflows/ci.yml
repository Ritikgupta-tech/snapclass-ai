name: SNAPCLASS AI — Continuous Integration & Quality Gate

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Automated Test Suite & Architecture Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libopenblas-dev liblapack-dev libsndfile1 ffmpeg

      - name: Upgrade build tooling
        run: |
          python -m pip install --upgrade pip "setuptools<81.0.0" wheel cmake

      - name: Install PyTorch (CPU-Only)
        run: |
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install application dependencies
        run: |
          pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt || \
          (pip install --no-cache-dir dlib && pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt)

      - name: Run Pytest Suite
        run: |
          pytest -v --tb=short
